# Delta Lake tables written by Spark, read through Trino. Requires a metastore (Hive Metastore or Glue);
# register tables with: CALL lake.system.register_table('gold','daily_sales','s3a://lake/gold/daily_sales');
connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083
hive.s3.endpoint=http://minio:9000
hive.s3.path-style-access=true
hive.s3.aws-access-key=${ENV:S3_ACCESS_KEY}
hive.s3.aws-secret-key=${ENV:S3_SECRET_KEY}
